name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK with kivy/buildozer image
        run: |
          docker run --rm -v "$(pwd)":/home/user/hostcwd kivy/buildozer:latest android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-dodge-apk
          path: bin/*.apk
